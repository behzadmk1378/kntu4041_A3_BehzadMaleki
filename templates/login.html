<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Responsive viewport for mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WebGIS</title>
    <!-- Link to external CSS file using Flask's url_for helper -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Main container for centering content -->
    <div class="container">
        <!-- Authentication box with login form -->
        <div class="auth-box">
            <h1>WebGIS Login</h1>
            
            <!-- Display error message if login failed -->
            <!-- Jinja2 template syntax for conditional rendering -->
            {% if error %}
            <div class="error-message">{{ error }}</div>
            {% endif %}
            
            <!-- Display success message (e.g., after successful registration) -->
            {% if success %}
            <div class="success-message">{{ success }}</div>
            {% endif %}
            
            <!-- Login form - submits to /login route via POST -->
            <form method="POST" action="{{ url_for('login') }}">
                <!-- Username input field -->
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                
                <!-- Password input field (hidden text) -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <!-- Submit button -->
                <button type="submit" class="btn">Login</button>
            </form>
            
            <!-- Link to registration page for new users -->
            <p class="auth-link">
                Don't have an account? <a href="{{ url_for('register') }}">Register here</a>
            </p>
        </div>
    </div>
</body>
</html>
